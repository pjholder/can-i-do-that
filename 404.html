<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Page Not Found — Can I Do That?</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body data-page="404">

  <main class="page">


    <!-- HEADER -->

    <header class="site-header">

      <a
        href="./index.html"
        class="brand"
      >
        CAN I DO THAT?
      </a>


      <nav
        class="desktop-nav"
        aria-label="Main navigation"
      >

        <a href="./index.html">
          Home
        </a>

        <a href="./skills.html">
          Skills
        </a>

        <a href="./about.html">
          About
        </a>

      </nav>

    </header>



    <!-- 404 -->

    <section class="not-found-page">

      <div class="not-found-inner">


        <!-- NUMBER -->

        <div class="not-found-number-wrap">

          <p class="not-found-number">
            404
          </p>


          <!-- FIRST SECRET MARK -->

          <button
            class="secret-first-mark"
            id="secretFirstMark"
            type="button"
            aria-label="A small hidden mark"
            hidden
          >
            ·
          </button>

        </div>



        <!-- MESSAGE -->

        <h1 class="not-found-heading">

          Can I find that page?

          <button
            class="secret-number-clue secret-clue-two"
            type="button"
            data-secret-digit="2"
            aria-label="A small hidden mark"
            hidden
          >
            ·
          </button>

        </h1>


        <p class="not-found-answer">
          Apparently not.
        </p>


        <p class="not-found-copy">
          See what else you can find.
        </p>



        <!-- ACTIONS -->

        <div class="not-found-actions">

          <a
            class="primary-button not-found-primary"
            href="./index.html"
          >
            Go home →
          </a>


          <button
            class="secret-number-clue secret-clue-zero"
            type="button"
            data-secret-digit="0"
            aria-label="A small hidden mark"
            hidden
          >
            +
          </button>


          <a
            class="not-found-secondary"
            href="./skills.html"
          >
            Try something instead →
          </a>

        </div>



        <!-- SECRET ENTRANCE -->

        <p
          class="not-found-note secret-line"
          id="secretLine"
        >

          That's

          <button
            class="secret-it-trigger"
            id="secretTrigger"
            type="button"
            aria-label="Hidden clue"
          >

            <span
              class="secret-i"
              aria-hidden="true"
            >
              <span class="secret-i-letter">
                ı
              </span>

              <span class="secret-i-dot"></span>
            </span><span aria-hidden="true">t</span>

            <span class="secret-screen-reader-text">
              it
            </span>

          </button>.

        </p>



        <!-- CODE -->

        <div
          class="secret-code-area"
          id="secretCodeArea"
          hidden
        >

          <button
            class="secret-found-button"
            id="secretFoundButton"
            type="button"
          >
            Found something?
          </button>


          <form
            class="secret-code-form"
            id="secretCodeForm"
            hidden
          >

            <label for="secretCodeInput">
              What did you find?
            </label>


            <div class="secret-code-row">

              <input
                id="secretCodeInput"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="4"
                aria-describedby="secretCodeMessage"
              >


              <button
                type="submit"
                aria-label="Try code"
              >
                →
              </button>

            </div>


            <p
              class="secret-code-message"
              id="secretCodeMessage"
              aria-live="polite"
            ></p>

          </form>

        </div>



        <!-- FINAL -->

        <div
          class="secret-final"
          id="secretFinal"
          hidden
        >

          <p>
            You really do click everything.
          </p>

          <p>
            Good.
          </p>

          <strong>
            LOOK
          </strong>

        </div>

      </div>

    </section>



    <!-- FOOTER -->

    <footer class="site-footer">

      <div class="footer-main">

        <nav
          class="footer-nav"
          aria-label="Footer navigation"
        >

          <a href="./privacy.html">
            Privacy
          </a>

          <a href="./terms.html">
            Terms
          </a>

          <a href="./safety.html">
            Safety
          </a>

        </nav>


        <p class="footer-copyright">

          © 2026 Can I Do That?

          <button
            class="secret-number-clue secret-clue-four"
            type="button"
            data-secret-digit="4"
            aria-label="A small hidden mark"
            hidden
          >
            ×
          </button>

        </p>

      </div>


      <div class="data-note">

        <p>
          Your skills and stories are stored on this device.
        </p>


        <div class="data-actions">

          <button
            type="button"
            data-backup
          >
            Back up
          </button>

          <button
            type="button"
            data-restore
          >
            Restore
          </button>

          <input
            class="restore-input"
            data-restore-input
            type="file"
            accept=".json,application/json"
          >

        </div>

      </div>

    </footer>


  </main>



  <!-- JAVASCRIPT -->

  <script src="./skills-data.js"></script>
  <script src="./storage.js"></script>
  <script src="./skill-cards.js"></script>
  <script src="./skills-page.js"></script>
  <script src="./suggestions.js"></script>
  <script src="./script.js"></script>
  <script src="./404-secret.js"></script>


</body>

</html>
