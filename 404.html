<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Page Not Found — Can I Do That?</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body data-page="404">

  <main class="page">


    <!-- HEADER -->

    <header class="site-header">

      <a
        href="./index.html"
        class="brand"
      >
        CAN I DO THAT?
      </a>


      <nav
        class="desktop-nav"
        aria-label="Main navigation"
      >

        <a href="./index.html">
          Home
        </a>

        <a href="./skills.html">
          Skills
        </a>

        <a href="./about.html">
          About
        </a>

      </nav>

    </header>



    <!-- 404 -->

    <section class="not-found-page">

      <div class="not-found-inner">

        <p class="not-found-number">
          404
        </p>


        <h1>
          Can I find that page?
        </h1>


        <p class="not-found-answer">
          Apparently not.
        </p>


        <p class="not-found-copy">
          See what else you can find.
        </p>


        <div class="not-found-actions">

          <a
            class="primary-button not-found-primary"
            href="./index.html"
          >
            Go home →
          </a>

          <a
            class="not-found-secondary"
            href="./skills.html"
          >
            Try something instead →
          </a>

        </div>


        <p class="not-found-note">
          You checked anyway.
        </p>

      </div>

    </section>



    <!-- FOOTER -->

    <footer class="site-footer">

      <div class="footer-main">

        <nav
          class="footer-nav"
          aria-label="Footer navigation"
        >

          <a href="./privacy.html">
            Privacy
          </a>

          <a href="./terms.html">
            Terms
          </a>

          <a href="./safety.html">
            Safety
          </a>

        </nav>


        <p class="footer-copyright">
          © 2026 Can I Do That?
        </p>

      </div>


      <div class="data-note">

        <p>
          Your skills and stories are stored on this device.
        </p>


        <div class="data-actions">

          <button
            type="button"
            data-backup
          >
            Back up
          </button>

          <button
            type="button"
            data-restore
          >
            Restore
          </button>

          <input
            class="restore-input"
            data-restore-input
            type="file"
            accept=".json,application/json"
          >

        </div>

      </div>

    </footer>


  </main>



  <!-- JAVASCRIPT -->

  <script src="./skills-data.js"></script>
  <script src="./storage.js"></script>
  <script src="./skill-cards.js"></script>
  <script src="./skills-page.js"></script>
  <script src="./suggestions.js"></script>
  <script src="./script.js"></script>


</body>

</html>
